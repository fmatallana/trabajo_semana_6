<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Préstamos de Libros</title>
    <link rel="stylesheet" type="text/css" href="styles.css">
</head>
<body>
    <h2>Formulario de Préstamo de Libros</h2>

    <form id="formPrestamo">
        <label for="nombre">Nombre del Estudiante:</label>
        <input type="text" id="nombre" required>

        <label for="titulo">Título del Libro:</label>
        <input type="text" id="titulo" required>

        <label for="fechaP">Fecha de Préstamo:</label>
        <input type="date" id="fechaP" required>

        <label for="fechaD">Fecha de Devolución:</label>
        <input type="date" id="fechaD" required>

        <button type="submit">Registrar Préstamo</button>
    </form>
    <script src="conexion.js"></script>
</body>
</html>
